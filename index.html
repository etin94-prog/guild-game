<html lang="ko">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

        <title>Survivor</title>
        <style id="gateStyle">
            html,
            body {
                margin: 0;
                height: 100%;
                background: #0d0b16;
                color: #eee;
                font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            }
            #gate {
                min-height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 16px;
                box-sizing: border-box;
            }
            #gate form {
                width: 100%;
                max-width: 320px;
                background: #171427;
                border: 1px solid #2c2845;
                border-radius: 14px;
                padding: 24px 20px;
                text-align: center;
            }
            #gate h1 {
                font-size: 20px;
                margin: 0 0 16px;
            }
            #gate input[type='password'] {
                width: 100%;
                box-sizing: border-box;
                padding: 12px;
                border-radius: 10px;
                border: 1px solid #3a3560;
                background: #0d0b16;
                color: #fff;
                font-size: 16px;
            }
            #gate label {
                display: block;
                margin: 12px 0;
                font-size: 14px;
                color: #bbb;
            }
            #gate button {
                width: 100%;
                padding: 12px;
                border: 0;
                border-radius: 10px;
                background: #5b6ee1;
                color: #fff;
                font-size: 16px;
            }
            #gate button:disabled {
                opacity: 0.6;
            }
            #gateBar {
                display: none;
                height: 14px;
                margin-top: 16px;
                border-radius: 7px;
                background: rgba(255, 255, 255, 0.18);
                overflow: hidden;
            }
            #gateBar i {
                display: block;
                width: 0;
                height: 100%;
                border-radius: 7px;
                background: linear-gradient(90deg, #ff8fb1, #ffd36e);
                transition: width 0.15s linear;
            }
            #gatePct {
                min-height: 20px;
                margin-top: 8px;
                font-size: 14px;
                color: #fff;
            }
            #gateMsg {
                min-height: 20px;
                margin-top: 10px;
                font-size: 14px;
                color: #ff9ab0;
            }
        </style>
    </head>

            (function () {

","n":3618734,"k":"lazy"},{"f":"p-dc75039207dc5216.bin","n":953124,"k":"sfx","s":"b","i":0},{"f":"p-8e7d99972bcf8ef3.bin","n":2542071,"k":"sfx","s":"b","i":0},{"f":"p-28fdbd2ab2c5dfb2.bin","n":2938,"k":"sfx","s":"b","i":0},{"f":"p-d0f5fe4bb5ad4984.bin","n":1063033,"k":"sfx","s":"b","i":0},{"f":"p-eae37e3553996776.bin","n":276805,"k":"lazy"},{"f":"p-3b99a4529024ef6d.bin","n":1211634,"k":"sfx","s":"b","i":1},{"f":"p-68fe910209a358bc.bin","n":1189893,"k":"sfx","s":"b","i":1},{"f":"p-697e8f011e270982.bin","n":2306,"k":"sfx","s":"b","i":1},{"f":"p-c93bb50af7f16c05.bin","n":5683325,"k":"sfx","s":"b","i":1},{"f":"p-a11c93a28d686706.bin","n":1059428,"k":"sfx","s":"c","i":0},{"f":"p-ee46935d44a58a99.bin","n":2746124,"k":"sfx","s":"c","i":0},{"f":"p-e4295b122f786b9a.bin","n":31733,"k":"sfx","s":"c","i":0},{"f":"p-4f1f75476bb7190f.bin","n":21600392,"k":"sfx","s":"c","i":0},{"f":"p-9ca6d34f2324cbd9.bin","n":603263,"k":"sfx","s":"c","i":1},{"f":"p-b9147b5c41c87ff1.bin","n":1659696,"k":"sfx","s":"c","i":1},{"f":"p-f872a86c58d0a8bf.bin","n":19129,"k":"sfx","s":"c","i":1},{"f":"p-37c07ee11e46726a.bin","n":30492914,"k":"sfx","s":"c","i":1},{"f":"core-dbf576dd1d4e7b7d.bin","n":2753656,"k":"core"}],"ver":"2026.11.08-1501","maxSeconds":0};
                const STORE = 'gate.key.' + META.salt;

                        'deriveKey'
                    ]);

                        { name: 'PBKDF2', salt: b64(META.salt), iterations: META.iterations, hash: 'SHA-256' },

                // on this device (Cache Storage) and are not downloaded again: after the first visit only

                    document.addEventListener('webglcontextlost', () => note('그래픽이 끊겼어요 (webglcontextlost)'), true);
                    const t0 = Date.now();
                    const dog = setInterval(() => {
                        const waiting = document.getElementById('loading');
                        if (!waiting) return clearInterval(dog); // (the game is up)
                        if (Date.now() - t0 > 20000) note('아직 "' + waiting.textContent + '" 입니다 (' + Math.round((Date.now() - t0) / 1000) + '초)');
                    }, 5000);
                    const s = document.createElement('script');
                    s.src = URL.createObjectURL(new Blob([app.js], { type: 'text/javascript' }));
                    s.onerror = () => note('게임 프로그램을 열지 못했어요 (script)');
                    document.body.appendChild(s);
                }

                async function tryStored() {
                    let raw = null;
                    try {
                        raw = localStorage.getItem(STORE);
                    } catch (e) {}
                    if (!raw) return false;
                    // remembered: no need to type anything, just wait for the download
                    const form = document.getElementById('gateForm');
                    const wait = document.createElement('h1');
                    wait.textContent = '⏳ 게임을 불러오는 중이에요';
                    const hide = [].filter.call(form.children, (el) => el !== bar && el !== pct);
                    hide.forEach((el) => (el.style.display = 'none'));
                    form.insertBefore(wait, form.firstChild);
                    const show = () => hide.forEach((el) => (el.style.display = ''));
                    try {
                        const key = await crypto.subtle.importKey('raw', b64(raw), 'AES-GCM', false, ['decrypt']);
                        await launch(key);
                        return true;
                    } catch (e) {
                        wait.remove();
                        bar.style.display = 'none';
                        pct.textContent = '';
                        show();
                        if (wrongKey(e)) {
                            // the password was changed since: forget the old one
                            try {
                                localStorage.removeItem(STORE);
                            } catch (e2) {}
                        } else {
                            // keep the remembered password; this was a loading problem
                            hide.forEach((el) => (el.style.display = 'none'));
                            const retry = document.createElement('h1');
                            retry.innerHTML = '😢 불러오지 못했어요.<br><button type="button" style="margin-top:14px;padding:12px 22px;font-size:16px;border-radius:12px">다시 시도</button>';
                            retry.querySelector('button').onclick = () => location.reload();
                            form.insertBefore(retry, form.firstChild);
                        }
                        return false;
                    }
                }

                document.getElementById('gateForm').addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const pw = document.getElementById('gatePw').value;
                    const remember = document.getElementById('gateRemember').checked;
                    if (!pw) return;
                    btn.disabled = true;
                    msg.textContent = '여는 중... (처음에는 조금 걸려요)';
                    try {
                        const key = await derive(pw, remember);
                        // (remembered as soon as the password is known to be right, before the game starts)
                        const raw = remember ? toB64(new Uint8Array(await crypto.subtle.exportKey('raw', key))) : null;
                        await launch(key, () => {
                            msg.textContent = '맞아요! 게임을 불러오는 중…';
                            if (!raw) return;
                            try {
                                localStorage.setItem(STORE, raw);
                            } catch (e2) {}
                        });
                    } catch (err) {
                        bar.style.display = 'none';
                        pct.textContent = '';
                        msg.textContent = wrongKey(err) ? '비밀번호가 틀렸어요.' : '불러오지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.';
                        btn.disabled = false;
                    }
                });

                if (!window.crypto || !crypto.subtle) {
                    msg.textContent = 'https 주소로 접속해 주세요.';
                    btn.disabled = true;
                } else {
                    tryStored();
                }
            })();
        </script>
    </body>
</html>
